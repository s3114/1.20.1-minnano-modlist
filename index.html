/* Hallmark · shape: index-first catalogue · genre: editorial · theme: Almanac (manual deal) · signature: searchable mod index · posture: restrained · v2.0.0 */
:root {
  color-scheme: light;
  --paper: oklch(84% .012 245);
  --paper-2: oklch(81% .012 245);
  --paper-3: oklch(77% .012 245);
  --sheet: oklch(93.5% .008 245);
  --ink: oklch(16% .020 245);
  --ink-2: oklch(24% .018 245);
  --muted: oklch(38% .016 245);
  --rule: oklch(73% .013 240);
  --rule-strong: oklch(32% .018 240);
  --accent: oklch(45% .180 350);
  --accent-dark: oklch(37% .160 350);
  --accent-ink: oklch(97% .006 245);
  --focus: oklch(46% .190 350);
  --font-display: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Newsreader", ui-serif, Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
  --container: 1440px;
  --gutter: clamp(20px, 5vw, 64px);
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 40px;
  --space-2xl: 64px;
  --radius: 2px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: clip; }
body { margin: 0; overflow-x: clip; background: var(--paper); color: var(--ink-2); font: 400 17px/1.58 var(--font-body); }
a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: .18em; }
a:hover { text-decoration-thickness: 2px; }
button, input, select { font: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
.container { width: min(var(--container), 100%); margin-inline: auto; padding-inline: var(--gutter); }
.catalogue { padding:76px 0 100px; }
.filter-panel { background:var(--sheet); border-top:2px solid var(--ink); padding:24px; margin-bottom:26px; }
.filter-top { display:grid; grid-template-columns:minmax(200px, 1.2fr) minmax(160px, 1fr) minmax(160px, 1fr) auto; gap:14px; align-items:end; }
.field label { display:block; margin-bottom:7px; color:var(--muted); font-size:14px; }
.field input,.field select { width:100%; min-height:48px; padding:0 13px; border:1px solid var(--muted); border-radius:0; background:var(--sheet); color:var(--ink); }
.field input::placeholder { color:var(--muted); opacity:.8; }
.filter-meta { display:flex; justify-content:space-between; align-items:center; gap:18px; margin-top:20px; padding-top:16px; border-top:1px solid var(--rule); }
.result-count { color:var(--ink); font:500 14px var(--font-display); }
.clear-btn { border:0; padding:6px 0; color:var(--ink); background:transparent; text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:4px; cursor:pointer; font:500 14px var(--font-display); }
.mod-list { border-top:2px solid var(--rule-strong); }
.mod-row { display:grid; grid-template-columns: minmax(0, 1fr) auto; gap:22px; padding:24px 8px 22px; border-bottom:1px solid var(--rule); }
.mod-main { min-width:0; }
.mod-thumb { align-self:start; display:grid; place-items:center; width:96px; height:96px; overflow:hidden; border:1px solid var(--rule-strong); background:var(--paper-2); color:var(--muted); font:600 32px var(--font-display); user-select:none; }
.mod-thumb img { display:block; width:100%; height:100%; object-fit:cover; }
.mod-topline { display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; margin-bottom:8px; }
.mod-index { color:var(--muted); font:400 12px var(--font-mono); }
.mod-tag { display:inline-block; color:var(--accent-dark); font-size:13px; }
.mod-row h3 { margin:0; font-size:25px; letter-spacing:-.025em; }
.mod-row .summary { max-width:76ch; margin:9px 0 0; font-size:16px; }
.mod-row details { margin-top:14px; }
.mod-row summary { display:inline-flex; align-items:center; gap:8px; color:var(--ink); cursor:pointer; font:600 14px var(--font-display); text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:4px; }
.mod-detail { max-width:78ch; margin-top:14px; padding:16px 18px; background:var(--paper-2); border-left:2px solid var(--rule-strong); }
.mod-detail p { margin:0 0 10px; }
.mod-detail p:last-child { margin-bottom:0; }
.mod-detail strong { color:var(--ink); font-family:var(--font-display); font-size:14px; }
.mod-link { align-self:start; color:var(--muted); text-decoration:none; font:500 13px var(--font-display); white-space:nowrap; }
.empty { padding:48px 10px; border-bottom:1px solid var(--rule); color:var(--muted); }
[hidden] { display:none !important; }
@media (max-width:850px) {
  .mod-thumb { width:64px; height:64px; font-size:22px; }
  .filter-top { grid-template-columns:1fr; }
  .filter-meta { align-items:flex-start; }
}
@media (prefers-reduced-motion:reduce) {
  html { scroll-behavior:auto; }
  *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}
</style>

    <script>
(() => {
  "use strict";
  const mods = JSON.parse(document.getElementById("mod-data").textContent);
  const search = document.getElementById("search");
  const mainTagSelect = document.getElementById("main-tag-select");
  const subTagSelect = document.getElementById("sub-tag-select");
  const list = document.getElementById("mod-list");
  const count = document.getElementById("result-count");
  const reset = document.getElementById("reset");
  const clearSearch = document.getElementById("clear-search");

  // タグデータを「メインジャンル」「サブジャンル」に分解 (例: "収納・バックパック" -> メイン: "収納", サブ: "バックパック")
  const taxonomy = {};
  mods.forEach(mod => {
    const parts = mod.tag.split("・");
    const main = parts[0] || "その他";
    const sub = parts[1] || "";
    if (!taxonomy[main]) {
      taxonomy[main] = new Set();
    }
    if (sub) {
      taxonomy[main].add(sub);
    }
  });

  const mainCategories = Object.keys(taxonomy).sort((a, b) => a.localeCompare(b, "ja"));

  // メインジャンルのプルダウンを初期化
  mainCategories.forEach(main => {
    const option = document.createElement("option");
    option.value = main;
    option.textContent = main;
    mainTagSelect.append(option);
  });

  function updateSubTags(selectedMain, keepSub = "") {
    subTagSelect.innerHTML = '<option value="">すべてのサブジャンル</option>';
    if (!selectedMain || !taxonomy[selectedMain] || taxonomy[selectedMain].size === 0) {
      subTagSelect.disabled = true;
      return;
    }

    const subs = [...taxonomy[selectedMain]].sort((a, b) => a.localeCompare(b, "ja"));
    subs.forEach(sub => {
      const option = document.createElement("option");
      option.value = sub;
      option.textContent = sub;
      if (sub === keepSub) {
        option.selected = true;
      }
      subTagSelect.append(option);
    });
    subTagSelect.disabled = false;
  }

  const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);

  // ---- Modrinthからアイコンを取得 ----
  const ICON_CACHE_KEY = "mod-field-guide:modrinth-icons:v1";
  const ICON_TTL = 7 * 24 * 60 * 60 * 1000;
  const API = "https://api.modrinth.com/v2";
  const icons = new Map(); // title -> icon_url ("" は「見つからなかった」)

  function loadIconCache() {
    try {
      const raw = JSON.parse(localStorage.getItem(ICON_CACHE_KEY) || "null");
      if (raw && Date.now() - raw.t < ICON_TTL) {
        Object.entries(raw.d).forEach(([title, url]) => icons.set(title, url));
      }
    } catch (e) { /* 保存領域が使えない環境では無視 */ }
  }
  function saveIconCache() {
    try {
      localStorage.setItem(ICON_CACHE_KEY, JSON.stringify({ t: Date.now(), d: Object.fromEntries(icons) }));
    } catch (e) { /* 無視 */ }
  }

  function fillThumb(el) {
    const mod = mods[Number(el.dataset.i)];
    const url = icons.get(mod.title);
    const initial = [...mod.title.trim()][0]?.toUpperCase() || "?";
    if (!url) {
      el.textContent = initial;
      return;
    }
    if (el.querySelector("img")?.getAttribute("src") === url) return;
    const img = document.createElement("img");
    img.src = url;
    img.alt = "";
    img.width = 96;
    img.height = 96;
    img.loading = "lazy";
    img.decoding = "async";
    img.addEventListener("error", () => { el.textContent = initial; });
    el.replaceChildren(img);
  }
  const applyIcons = () => list.querySelectorAll(".mod-thumb").forEach(fillThumb);

  async function searchIcon(mod) {
    const q = (mod.query || mod.title.replace(/[（(].*?[）)]/g, "").replace(/シリーズ$/, "")).trim();
    const facets = encodeURIComponent('[["project_type:mod"]]');
    const res = await fetch(`${API}/search?query=${encodeURIComponent(q)}&limit=1&facets=${facets}`);
    if (!res.ok) throw new Error("search failed");
    const data = await res.json();
    return data.hits?.[0]?.icon_url || "";
  }

  async function fetchIcons() {
    const pending = mods.filter(mod => !icons.has(mod.title));
    if (!pending.length) return;

    // 1) スラッグが分かっているものは1回のリクエストでまとめて取得
    const bySlug = new Map();
    const slugs = [...new Set(pending.map(mod => mod.slug).filter(Boolean))];
    if (slugs.length) {
      try {
        const res = await fetch(`${API}/projects?ids=${encodeURIComponent(JSON.stringify(slugs))}`);
        if (!res.ok) throw new Error("projects failed");
        (await res.json()).forEach(p => bySlug.set(String(p.slug).toLowerCase(), p.icon_url || ""));
      } catch (e) {
        return; // ネットワーク不可: プレースホルダーのまま(次回再試行)
      }
    }
    pending.forEach(mod => {
      const hit = mod.slug && bySlug.get(mod.slug.toLowerCase());
      if (hit) icons.set(mod.title, hit);
    });
    applyIcons();
    saveIconCache();

    // 2) 見つからなかったもの/スラッグ未設定のものは検索で補完
    for (const mod of pending.filter(mod => !icons.has(mod.title))) {
      try {
        icons.set(mod.title, await searchIcon(mod));
        applyIcons();
      } catch (e) { break; }
    }
    saveIconCache();
  }

  function render() {
    const query = search.value.trim().toLocaleLowerCase("ja");
    const selectedMain = mainTagSelect.value;
    const selectedSub = subTagSelect.value;

    const filtered = mods.filter(mod => {
      const haystack = [mod.title, mod.tag, mod.heading, mod.detail].join(" ").toLocaleLowerCase("ja");
      const parts = mod.tag.split("・");
      const modMain = parts[0] || "";
      const modSub = parts[1] || "";

      const matchQuery = !query || haystack.includes(query);
      const matchMain = !selectedMain || modMain === selectedMain;
      const matchSub = !selectedSub || modSub === selectedSub;

      return matchQuery && matchMain && matchSub;
    });

    count.textContent = `${filtered.length} / ${mods.length} 件を表示`;

    if (!filtered.length) {
      list.innerHTML = '<div class="empty">該当するModが見つかりませんでした。検索語やジャンルを変更してください。</div>';
      return;
    }

    list.innerHTML = filtered.map(mod => {
      const index = mods.indexOf(mod) + 1;
      const paragraphs = mod.detail.split(/\n+/).filter(Boolean).map(line => {
        const match = line.match(/^【([^】]+)】(.*)$/);
        if (match) return `<p><strong>${escapeHTML(match[1])}</strong>${escapeHTML(match[2])}</p>`;
        return `<p>${escapeHTML(line)}</p>`;
      }).join("");
      return `
        <article class="mod-row">
          <div class="mod-main">
            <div class="mod-topline">
              <span class="mod-index">${String(index).padStart(2,"0")}</span>
              <span class="mod-tag">${escapeHTML(mod.tag)}</span>
            </div>
            <h3>${escapeHTML(mod.title)}</h3>
            <p class="summary">${escapeHTML(mod.heading)}</p>
            <details>
              <summary>詳しく見る</summary>
              <div class="mod-detail">${paragraphs}</div>
            </details>
          </div>
          <div class="mod-thumb" data-i="${index - 1}" aria-hidden="true"></div>
        </article>`;
    }).join("");
    list.querySelectorAll(".mod-thumb").forEach(fillThumb);
  }

  mainTagSelect.addEventListener("change", () => {
    const currentMain = mainTagSelect.value;
    updateSubTags(currentMain);
    render();
  });

  subTagSelect.addEventListener("change", render);
  search.addEventListener("input", render);

  reset.addEventListener("click", () => {
    search.value = "";
    mainTagSelect.value = "";
    updateSubTags("");
    render();
    search.focus();
  });

  clearSearch.addEventListener("click", () => {
    search.value = "";
    render();
    search.focus();
  });

  loadIconCache();
  render();
  fetchIcons();
})();
</script>
  </body>
</html>
